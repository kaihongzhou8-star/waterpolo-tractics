      <details class="sec grow" open>
        <summary><span class="ic">📋</span>战术讲解</summary>
        <div class="sec-body">
          <div class="row between"><span class="note">动画播放时自动生成</span><button id="clearLog" type="button">清空</button></div>
          <div id="log"></div>
        </div>
      </details>

    </div>
  </aside>
</div>

<script>
(() => {
  // ===== 比例尺与场地参数（单位：米） =====
  let SCALE = 25;              // 像素/米：按屏幕可用区域自适应（横纵共用同一个比例尺，任何视角、任何窗口下都不会变形）
  const BASE_SCALE = 25;       // 字号等以 25 像素/米为基准按比例放大
  const FIELD_L = 25;          // 场地长（x 方向）
  const FIELD_W = 20;          // 场地宽（y 方向）
  const MARGIN = 3;            // 场地四周留白

  const GOAL_W = 3;
  const GOAL_DEPTH = 0.4;
  const GOAL_AREA_W = 7.16;
  const GOAL_AREA_D = 2;
  const SUB_ZONE_W = 1;
  const SUB_ZONE_FROM = 2;
  const SUB_ZONE_TO = 23;
  const REENTRY_ALONG = 2;
  const REENTRY_DEPTH = 1;

  // ===== 实体参数 =====
  const PLAYER_R = 0.5;
  const BALL_R = 0.3;
  const MIN_PLAYERS = 3, MAX_PLAYERS = 7;   // 场上球员人数范围（不含门将）
  const DRAG_THRESHOLD = 4;
  const SWIM_SPEED = 4.2;                   // 路径动画的基准游速（米/秒）
  const TEAMS = {
    A: { cap: '#ffffff', capStroke: '#9aa7b3', text: '#000000', name: '白队' },
    B: { cap: '#1e5bd6', capStroke: '#0d2f73', text: '#ffffff', name: '蓝队' },
    GK: { cap: '#e02b2b', capStroke: '#7d1010' },   // 门将：纯红帽，不显示数字
  };
  const PASS_COLOR = '#0b2a4a';
  const SHOT_COLOR = '#ff5a00';
  const ACTIVE_COLOR = '#19c37d';

  // =====================================================================
  //                       视角系统（模式 + 方向）
  // =====================================================================
  // 统一的物理坐标系（米）：x 沿长度方向（0 = 左底线球门线，12.5 = 中线，25 = 右底线），y 沿宽度方向（0–20）。
  // 球员、水球、连线、轨迹全部以这套米制坐标存储；视角只决定“看哪一段”和“怎么转到屏幕上”，数据本身永不改变。
  //
  // 两个互相独立的状态：
  //   mode 显示模式：
  //     full  全景：x ∈ [-3, 28]，完整 25 米场地；只允许横向（球门在左 / 右）
  //     half  半场：x ∈ [-3, 15]，以中线为界只显示 0–12.5 米这一侧（再多 2.5 米到中线另一侧）；四个方向都允许
  //   ori  方向：球门出现在屏幕的哪一侧（left / right / top / bottom）
  const VIEWS = {
    full: { x0: -MARGIN, x1: FIELD_L + MARGIN, label: '全景模式', oris: ['left', 'right'] },
    half: { x0: -MARGIN, x1: 15,               label: '半场模式', oris: ['left', 'right', 'top', 'bottom'] },
  };
  const view = { mode: 'full', x0: VIEWS.full.x0, x1: VIEWS.full.x1, ori: 'left' };
  // 当前模式下不支持的方向（如全景 + 上）回落到“左”
  const normalizeOri = (mode, ori) => (VIEWS[mode].oris.includes(ori) ? ori : 'left');

  // ===== 方向 → 变换矩阵 =====
  // 所有绘制仍然在“未旋转的场地像素空间”（球门在左、横向为长边）里完成；方向只体现在一个矩阵上：
  //   render() 用它把整张场地旋转到屏幕上，eventToMeters() 用它的逆变换把鼠标位置还原回场地坐标。
  // 因此球员/水球的阵型（米制坐标）完全不变，拖拽在任何方向下都能正确控制“前后/左右”。
  //   left   球门在左（0°）        right  球门在右（180°）
  //   top    球门在上（顺时针 90°）  bottom 球门在下（逆时针 90°）
  const ORIENTS = {
    left:   { label: '球门在左', angle: 0 },
    right:  { label: '球门在右', angle: Math.PI },
    top:    { label: '球门在上', angle: Math.PI / 2 },
    bottom: { label: '球门在下', angle: -Math.PI / 2 },
  };
  const isVertical = () => view.ori === 'top' || view.ori === 'bottom';
  // 未旋转像素 (a,b) → 屏幕像素 的矩阵 [m11 m12 m21 m22 dx dy]（ctx.setTransform 的 a b c d e f）
  function oriMatrix() {
    const W = cssW, H = cssH;
    switch (view.ori) {
      case 'right':  return [-1, 0, 0, -1, W, H];
      case 'top':    return [0, 1, -1, 0, H, 0];
      case 'bottom': return [0, -1, 1, 0, 0, W];
      default:       return [1, 0, 0, 1, 0, 0];
    }
  }
  // 屏幕像素 → 未旋转像素（上面矩阵的逆）
  function screenToField(sx, sy) {
    const W = cssW, H = cssH;
    switch (view.ori) {
      case 'right':  return { a: W - sx, b: H - sy };
      case 'top':    return { a: sy, b: H - sx };
      case 'bottom': return { a: W - sy, b: sx };
      default:       return { a: sx, b: sy };
    }
  }
  // 文字始终保持正向：在旋转后的坐标系里反向转回去再写
  // along=true：竖向视角下让文字沿场地长边排列（用于窄长的换人区标签），横向视角时仍然正向
  function drawText(str, x, y, along = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(along && isVertical() ? 0 : -ORIENTS[view.ori].angle);
    ctx.fillText(str, 0, 0);
    ctx.restore();
  }

  const canvas = document.getElementById('pool');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  let cssW = 0, cssH = 0;

  // 米 → 像素（随视角变化的映射）
  const px = m => (m - view.x0) * SCALE;
  const py = m => (m + MARGIN) * SCALE;
  const len = m => m * SCALE;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  // 按当前视角重算画布尺寸（切换视角时调用）
  function resizeCanvas() {
    // 取画布容器的可用空间，按“长边适配”求出像素/米，使场地尽量撑满屏幕且不变形
    const box = canvas.parentElement;
    const cs = getComputedStyle(box);
    const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    const gap = window.innerWidth <= 768 ? 8 : 24;
    const availW = Math.max(120, box.clientWidth - padX - gap);
    const availH = Math.max(120, box.clientHeight - padY - gap);
    const fl = view.x1 - view.x0, fw = FIELD_W + 2 * MARGIN;        // 场地可见范围（米）
    const vert = isVertical();
    // 竖向（球门在上/下）时屏幕上的宽高互换，比例尺按旋转后的外框求解
    SCALE = clamp(Math.min(availW / (vert ? fw : fl), availH / (vert ? fl : fw)), 4, 90);
    cssW = fl * SCALE;                                              // 未旋转的场地像素尺寸
    cssH = fw * SCALE;
    const sw = vert ? cssH : cssW, sh = vert ? cssW : cssH;         // 屏幕上的画布尺寸
    canvas.width = Math.round(sw * dpr);
    canvas.height = Math.round(sh * dpr);
    canvas.style.width = sw + 'px';
    canvas.style.height = sh + 'px';
  }

  // 把模式 + 方向应用到画布，并同步面板控件与顶部标签（唯一修改 view 状态的地方）
  function applyView(mode, ori) {
    if (!VIEWS[mode]) mode = 'full';
    ori = normalizeOri(mode, ori);
    view.mode = mode;
    view.ori = ori;
    view.x0 = VIEWS[mode].x0;
    view.x1 = VIEWS[mode].x1;
    resizeCanvas();
    syncViewUI();
    requestRender();
  }

  // 面板控件与当前视角保持一致：单选按钮 + 方向任务栏（全景模式下“上/下”置灰禁用）
  function syncViewUI() {
    document.querySelectorAll('input[name="viewMode"]').forEach(r => { r.checked = r.value === view.mode; });
    document.querySelectorAll('#oriBar button').forEach(b => {
      const o = b.dataset.ori;
      b.disabled = !VIEWS[view.mode].oris.includes(o);
      b.setAttribute('aria-pressed', String(o === view.ori));
    });
    const note = document.getElementById('oriNote');
    if (note) note.textContent = view.mode === 'full' ? '全景模式只支持横向（球门在左 / 右），切换到半场模式可使用 ↑ ↓。'
                                                      : '半场模式：球门在所选方向，可随时切换。';
    const tag = document.getElementById('viewTag');
    if (tag) tag.textContent = VIEWS[view.mode].label + ' · 球门在' + ORIENTS[view.ori].label.slice(-1);
  }

  // 攻防方向：全场 —— 白队守左门、攻右门；半场（左侧防守半场）—— 蓝队守左门，白队攻向左门
  const attackSide = team => ((team === 'A') === (view.mode === 'full') ? 'R' : 'L');
  const attackDir = team => (attackSide(team) === 'R' ? 1 : -1);
  const goalXOf = side => (side === 'L' ? 0 : FIELD_L);

  function lineM(x1, y1, x2, y2, color, width = 3) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(px(x1), py(y1));
    ctx.lineTo(px(x2), py(y2));
    ctx.stroke();
    ctx.restore();
  }

  function label(text, xm, ym, color = 'rgba(255,255,255,.85)', size = 11, along = false) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = `${size * SCALE / BASE_SCALE}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    drawText(text, px(xm), py(ym), along);
    ctx.restore();
  }

  // ===== 场地底图 =====
  // 所有元素都用场地坐标绘制；落在当前视角之外的部分（如半场模式下的右半场）会被画布自然裁掉，
  // 所以半场模式只会看到左半场的 2/5/6 米线、左禁区、左底线后水牢、中线和边线换人区。
  function drawPool() {
    ctx.fillStyle = '#8fd3f4';
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.fillStyle = '#7ccbf0';
    ctx.fillRect(px(0), py(0), len(FIELD_L), len(FIELD_W));

    // 快速换人区
    ctx.fillStyle = 'rgba(46, 204, 113, 0.45)';
    ctx.fillRect(px(SUB_ZONE_FROM), py(-SUB_ZONE_W), len(SUB_ZONE_TO - SUB_ZONE_FROM), len(SUB_ZONE_W));
    ctx.fillRect(px(SUB_ZONE_FROM), py(FIELD_W), len(SUB_ZONE_TO - SUB_ZONE_FROM), len(SUB_ZONE_W));
    const subLabelX = (SUB_ZONE_FROM + Math.min(SUB_ZONE_TO, view.x1)) / 2;   // 标签居中于“可见”的那一段
    label('快速换人区', subLabelX, -SUB_ZONE_W / 2, '#0b5d2c', 11, true);
    label('快速换人区', subLabelX, FIELD_W + SUB_ZONE_W / 2, '#0b5d2c', 11, true);

    // 重新入场区（水牢）：球门线后方
    ctx.fillStyle = 'rgba(231, 76, 60, 0.5)';
    ctx.fillRect(px(-REENTRY_DEPTH), py(0), len(REENTRY_DEPTH), len(REENTRY_ALONG));
    ctx.fillRect(px(FIELD_L), py(FIELD_W - REENTRY_ALONG), len(REENTRY_DEPTH), len(REENTRY_ALONG));
    ctx.save();
    ctx.strokeStyle = 'rgba(192, 57, 43, 0.9)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px(-REENTRY_DEPTH), py(0), len(REENTRY_DEPTH), len(REENTRY_ALONG));
    ctx.strokeRect(px(FIELD_L), py(FIELD_W - REENTRY_ALONG), len(REENTRY_DEPTH), len(REENTRY_ALONG));
    ctx.restore();

    // 球门区
    const gaY = (FIELD_W - GOAL_AREA_W) / 2;
    [0, FIELD_L - GOAL_AREA_D].forEach(x => {
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(px(x), py(gaY), len(GOAL_AREA_D), len(GOAL_AREA_W));
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.strokeRect(px(x), py(gaY), len(GOAL_AREA_D), len(GOAL_AREA_W));
      ctx.restore();
    });

    // 标记线：6 米黄线、5 米红线、2 米红线、中线、底线、边线
    const W = 3;
    lineM(6, 0, 6, FIELD_W, '#f1c40f', W);
    lineM(FIELD_L - 6, 0, FIELD_L - 6, FIELD_W, '#f1c40f', W);
    lineM(5, 0, 5, FIELD_W, '#e74c3c', W);
    lineM(FIELD_L - 5, 0, FIELD_L - 5, FIELD_W, '#e74c3c', W);
    lineM(2, 0, 2, FIELD_W, '#e74c3c', W);
    lineM(FIELD_L - 2, 0, FIELD_L - 2, FIELD_W, '#e74c3c', W);
    lineM(FIELD_L / 2, 0, FIELD_L / 2, FIELD_W, '#ffffff', W);
    lineM(0, 0, 0, FIELD_W, '#ffffff', 4);
    lineM(FIELD_L, 0, FIELD_L, FIELD_W, '#ffffff', 4);
    lineM(0, 0, FIELD_L, 0, '#ffffff', 2);
    lineM(0, FIELD_W, FIELD_L, FIELD_W, '#ffffff', 2);

    // 球门
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    goals.forEach(g => {
      const x = g.side === 'L' ? -GOAL_DEPTH : FIELD_L;
      const y = FIELD_W / 2 - GOAL_W / 2;
      ctx.fillRect(px(x), py(y), len(GOAL_DEPTH), len(GOAL_W));
      ctx.strokeRect(px(x), py(y), len(GOAL_DEPTH), len(GOAL_W));
    });
    ctx.restore();

    // 标注
    [[2, '2m'], [5, '5m'], [6, '6m'], [FIELD_L - 6, '6m'], [FIELD_L - 5, '5m'], [FIELD_L - 2, '2m']]
      .forEach(([x, t]) => label(t, x, -1.9));
    label('中线', FIELD_L / 2, -1.9);
    label('重新入场区', -REENTRY_DEPTH / 2 - 0.05, REENTRY_ALONG + 0.7, '#7a1f15', 10);
    label('重新入场区', FIELD_L + REENTRY_DEPTH / 2 + 0.05, FIELD_W - REENTRY_ALONG - 0.7, '#7a1f15', 10);
    label('球门区 7.16m × 2m', 2.6, FIELD_W / 2 - GOAL_AREA_W / 2 - 0.6, 'rgba(255,255,255,.9)', 10);
    label('球门区 7.16m × 2m', FIELD_L - 2.6, FIELD_W / 2 + GOAL_AREA_W / 2 + 0.6, 'rgba(255,255,255,.9)', 10);

    if (view.mode === 'half' && !isVertical()) {      // 竖向时画布边缘放不下这行字，改由左上角标签提示
      label('半场视角 · 左侧防守半场（视野到中线右侧 2.5 米）', (view.x0 + view.x1) / 2, FIELD_W + 2.2, '#0b2a4a', 11);
    }
  }

  // ===== 实体数据 =====
  const goals = [
    { kind: 'goal', side: 'L', x: 0,       y: FIELD_W / 2 },   // 左侧球门
    { kind: 'goal', side: 'R', x: FIELD_L, y: FIELD_W / 2 },   // 右侧球门
  ];
  const ball = { kind: 'ball', x: FIELD_L / 2, y: FIELD_W / 2, hidden: false };
  let players = [];     // { kind:'player', team, num, isGK, x, y }；场上球员号码从 1 起，门将编号为 0 且从不显示
  let lines = [];       // { type:'pass'|'shot', from, to }，from/to 可以是实体，也可以是固定锚点 {x,y}
  let trails = [];      // 跑动轨迹：{ team, pts:[{x,y}...] }。只存坐标副本，不引用球员，所以拖拽球员不会影响旧轨迹
  let markers = [];     // 场上标记点（如演示里的“中心点”）：{ x, y, label }

  let showNumbers = true;
  let showTrails = true;
  let lineMode = false;
  let selected = null;

  // 动画状态
  let running = false;
  let queue = [];       // 待执行的指令组（每组内的指令并行执行）
  let runToken = 0;
  let activeTweens = [];
  let activeEnts = [];
  const pulse = { r: 0 };

  // =====================================================================
  //                           初始站位（自适应视角）
  // =====================================================================
  // 号码规则：门将红帽无数字（内部编号固定为 0，只能用“守门员”指代）；
  // 场上球员从 1 号起顺延（无门将时也从 1 号开始；6 人是 1–6 号，7 人是 1–7 号）。
  const GK_NUM = 0;
  const FIRST_NUM = 1;                 // 场上球员的起始号码（全局唯一的号码起点）
  const GK_X = 0.5;                    // 门将站在己方球门线上、球门正中
  const FORMATION = {                  // 全场开场站位：数值为“距己方球门线的米数”
    A: { front: 11, back: 7 },         //   白队：外围准备进攻（己方半场内靠近中线）
    B: { front: 5.5, back: 3 },        //   蓝队：防守阵型（6 人即 3-3）
  };

  // —— 全场：白队守左门，蓝队守右门，各自在己方半场就位 ——
  function buildTeamFull(team, k, hasGK) {
    const list = [];
    const X = x => (team === 'B' ? FIELD_L - x : x);
    if (hasGK) list.push({ kind: 'player', team, num: GK_NUM, isGK: true, x: X(GK_X), y: FIELD_W / 2 });
    const front = Math.ceil(k / 2), back = k - front;
    const row = (count, xm, startNum) => {
      for (let i = 0; i < count; i++) {
        const slot = (FIELD_W - 4) / count;
        list.push({ kind: 'player', team, num: startNum + i, isGK: false, x: X(xm), y: 2 + slot * (i + 0.5) });
      }
    };
    row(front, FORMATION[team].front, FIRST_NUM);
    if (back > 0) row(back, FORMATION[team].back, FIRST_NUM + front);
    return list;
  }

  // —— 半场（左侧防守半场，阵地战）——
  //   蓝队：守门员在左底线；场上球员回缩成两排防守（前排 4.5 米、后排 2.6 米，6 人即 3-3）
  //   白队：球员沿 5–6 米线外围的弧线展开准备进攻（两翼靠近 5–6 米线，中路更远）；
  //         白队守门员（若有）站在半场最右侧边缘（己方球门远在画面之外）
  const HALF_GK_X = 14.2;
  function buildTeamHalf(team, k, hasGK) {
    const list = [];
    if (team === 'B') {
      if (hasGK) list.push({ kind: 'player', team, num: GK_NUM, isGK: true, x: GK_X, y: FIELD_W / 2 });
      const front = Math.ceil(k / 2), back = k - front;
      const row = (count, x, startNum) => {
        for (let i = 0; i < count; i++) {
          const slot = (FIELD_W - 4) / count;
          list.push({ kind: 'player', team, num: startNum + i, isGK: false, x, y: 2 + slot * (i + 0.5) });
        }
      };
      row(front, 4.5, FIRST_NUM);
      if (back > 0) row(back, 2.6, FIRST_NUM + front);
    } else {
      if (hasGK) list.push({ kind: 'player', team, num: GK_NUM, isGK: true, x: HALF_GK_X, y: FIELD_W / 2 });
      for (let i = 0; i < k; i++) {
        const y = k === 1 ? FIELD_W / 2 : 2.5 + 15 * i / (k - 1);
        const r = Math.abs(y - FIELD_W / 2) / 7.5;
        list.push({ kind: 'player', team, num: FIRST_NUM + i, isGK: false, x: 7.8 - 2.2 * r * r, y });
      }
    }
    return list;
  }

  function clampCount(input) {
    let v = parseInt(input.value, 10);
    if (isNaN(v)) v = MAX_PLAYERS;
    v = clamp(v, MIN_PLAYERS, MAX_PLAYERS);
    input.value = v;
    return v;
  }

  const $ = id => document.getElementById(id);
  const els = {
    countA: $('countA'), gkA: $('gkA'), countB: $('countB'), gkB: $('gkB'),
    showNums: $('showNums'), showTrails: $('showTrails'), clearTrails: $('clearTrails'),
    lineMode: $('lineMode'), clearLines: $('clearLines'), resetBtn: $('resetBtn'), defaultsBtn: $('defaultsBtn'), hint: $('hint'),
    log: $('log'), clearLog: $('clearLog'), cmdInput: $('cmdInput'), runBtn: $('runBtn'),
  };
  const scnButtons = Array.from(document.querySelectorAll('button.scn'));

  // 按“当前控制面板设置 + 当前视角”计算全部球员与水球的目标位置（不改动现有状态）
  function layoutAll() {
    const nA = clampCount(els.countA), nB = clampCount(els.countB);
    const gkA = els.gkA.value === '1', gkB = els.gkB.value === '1';
    const build = view.mode === 'half' ? buildTeamHalf : buildTeamFull;
    const list = [...build('A', nA, gkA), ...build('B', nB, gkB)];

    let ballPos = { x: FIELD_L / 2, y: FIELD_W / 2 };
    if (view.mode === 'half') {                 // 半场：水球在白队最靠近中路的球员身前
      const carrier = list.filter(p => p.team === 'A' && !p.isGK)
        .sort((a, b) => Math.abs(a.y - FIELD_W / 2) - Math.abs(b.y - FIELD_W / 2))[0];
      if (carrier) ballPos = { x: carrier.x + attackDir('A') * 0.8, y: carrier.y };
    }
    return { list, ballPos, nA, nB, gkA, gkB };
  }

  function markScenario(key) {
    scnButtons.forEach(b => b.classList.toggle('on', b.dataset.scn === key));
  }

  function stopAnimations() {
    runToken++;
    activeTweens.forEach(t => t.kill && t.kill());
    activeTweens = [];
    queue = [];
    running = false;
    activeEnts = [];
    markScenario(null);
  }

  // 根据控制面板的当前设置和视角重新生成所有球员（实时重绘）
  function rebuild() {
    stopAnimations();
    const { list, ballPos } = layoutAll();
    players = list;
    ball.x = ballPos.x;
    ball.y = ballPos.y;
    ball.hidden = false;
    lines = [];
    trails = [];
    markers = [];
    setSelected(null);
    requestRender();
  }

  // ===== 视角切换 =====
  const keyOf = p => `${p.team}${p.isGK ? 'g' : p.num}`;

  function viewNote(mode) {
    if (mode === 'full') return '已切换到全场视角：双方按各自半场就位，蓝队在右侧防守阵型，白队在己方半场外围准备进攻。';
    const { nA, nB, gkB } = layoutAll();
    const front = Math.ceil(nB / 2), back = nB - front;
    return `已切换到半场视角（左侧防守半场）：${gkB ? '蓝队守门员在左底线，' : ''}蓝队${nB}名场上球员回缩成${front}-${back}防守；` +
      `白队${nA}名场上球员在5–6米线外围展开，准备进攻。`;
  }

  /**
   * 切换视角。animate=true 时：画布立刻按新视角重算尺寸，原有球员/水球用 GSAP 平滑游向新视角下的站位；
   * animate=false 时直接重排（战术按钮使用）。
   */
  function changeView(mode, animate, ori = view.ori) {
    ori = normalizeOri(mode, ori);
    if (mode === view.mode) {                                  // 同一模式下只换方向：纯旋转，阵型与数据不动
      if (ori !== view.ori) { applyView(mode, ori); setSelected(null); updateHint(); }
      else syncViewUI();
      return;
    }
    if (!animate) { applyView(mode, ori); rebuild(); return; }

    stopAnimations();
    const prev = new Map(players.map(p => [keyOf(p), { x: p.x, y: p.y }]));
    applyView(mode, ori);

    const { list, ballPos } = layoutAll();
    const tasks = [];
    list.forEach(p => {
      const tx = p.x, ty = p.y, o = prev.get(keyOf(p));
      if (o) { p.x = o.x; p.y = o.y; }                       // 从旧位置出发
      tasks.push({ obj: p, tx, ty });
    });
    players = list;
    ball.hidden = false;
    tasks.push({ obj: ball, tx: ballPos.x, ty: ballPos.y });  // 水球从当前位置出发
    lines = []; trails = []; markers = [];
    setSelected(null);

    running = true;                                           // 重新分布期间锁定手动操作
    const token = runToken;
    addEntry('视角切换 · ' + VIEWS[mode].label, viewNote(mode), 'sys');
    requestRender();
    Promise.all(tasks.map(t =>
      animatePath(t.obj, [{ x: t.obj.x, y: t.obj.y }, { x: t.tx, y: t.ty }], 1.1, 'power2.inOut', { noTrail: true })
    )).then(() => {
      if (token !== runToken) return;
      running = false;
      requestRender();
    });
  }

  // ===== 绘制：实体 =====
  function drawPlayer(p) {
    const style = p.isGK ? TEAMS.GK : TEAMS[p.team];
    const cx = px(p.x), cy = py(p.y), r = len(PLAYER_R);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx + 1.5, cy + 2, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = style.cap;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = style.capStroke;
    ctx.stroke();
    // 号码：门将永远不画数字；场上球员由全局复选框控制
    if (!p.isGK && showNumbers) {
      ctx.fillStyle = style.text;
      ctx.font = `bold ${13 * SCALE / BASE_SCALE}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      drawText(String(p.num), cx, cy + 0.5);
    }
    ctx.restore();
  }

  function drawBall() {
    if (ball.hidden) return;
    const cx = px(ball.x), cy = py(ball.y), r = len(BALL_R);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx + 1, cy + 1.5, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd400';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#b38f00';
    ctx.stroke();
    ctx.restore();
  }

  // ===== 绘制：跑动轨迹（半透明虚线，队伍颜色；移动结束后保留）=====
  function drawTrails() {
    if (!showTrails || !trails.length) return;
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    trails.forEach(tr => {
      if (tr.pts.length < 2) return;
      const white = tr.team === 'A';
      const path = () => {
        ctx.beginPath();
        tr.pts.forEach((p, i) => (i ? ctx.lineTo(px(p.x), py(p.y)) : ctx.moveTo(px(p.x), py(p.y))));
      };
      // 底层衬边：保证白色轨迹在浅蓝水面上也看得清
      ctx.setLineDash([8, 6]);
      ctx.lineWidth = 5.5;
      ctx.strokeStyle = white ? 'rgba(11, 42, 74, 0.28)' : 'rgba(255, 255, 255, 0.35)';
      path();
      ctx.stroke();
      ctx.lineWidth = 3;
      ctx.strokeStyle = white ? 'rgba(255, 255, 255, 0.9)' : 'rgba(30, 91, 214, 0.85)';
      path();
      ctx.stroke();
      // 起点小圆点
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(px(tr.pts[0].x), py(tr.pts[0].y), 3.5, 0, Math.PI * 2);
      ctx.fillStyle = white ? '#ffffff' : '#1e5bd6';
      ctx.fill();
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = white ? 'rgba(11, 42, 74, 0.6)' : 'rgba(255, 255, 255, 0.8)';
      ctx.stroke();
    });
    ctx.restore();
  }

  function drawMarkers() {
    markers.forEach(m => {
      const cx = px(m.x), cy = py(m.y);
      ctx.save();
      ctx.strokeStyle = '#0b2a4a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy);
      ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#0b2a4a';
      ctx.font = `${11 * SCALE / BASE_SCALE}px sans-serif`;
      ctx.textAlign = 'center';
      drawText(m.label, cx, cy + 20 * SCALE / BASE_SCALE);
      ctx.restore();
    });
  }

  // ===== 绘制：箭头连线 =====
  function drawArrow(x1, y1, x2, y2, color, dashed, width) {
    const dx = x2 - x1, dy = y2 - y1;
    const dist = Math.hypot(dx, dy);
    if (dist < 8) return;
    const ux = dx / dist, uy = dy / dist;
    const head = 11;
    const bx = x2 - ux * head * 0.8;
    const by = y2 - uy * head * 0.8;
    const dash = dashed ? [9, 6] : [];

    const stroke = (c, w) => {
      ctx.save();
      ctx.strokeStyle = c;
      ctx.lineWidth = w;
      ctx.lineCap = 'round';
      ctx.setLineDash(dash);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(bx, by);
      ctx.stroke();
      ctx.restore();
    };
    stroke('rgba(255,255,255,0.55)', width + 3);
    stroke(color, width);

    const ang = Math.atan2(dy, dx), spread = Math.PI / 7;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - head * Math.cos(ang - spread), y2 - head * Math.sin(ang - spread));
    ctx.lineTo(x2 - head * Math.cos(ang + spread), y2 - head * Math.sin(ang + spread));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawLine(l) {
    const x1 = px(l.from.x), y1 = py(l.from.y);
    const x2 = px(l.to.x),   y2 = py(l.to.y);
    const dx = x2 - x1, dy = y2 - y1;
    const dist = Math.hypot(dx, dy) || 1;
    const ux = dx / dist, uy = dy / dist;

    if (l.type === 'pass') {
      const r = len(PLAYER_R);
      drawArrow(x1 + ux * (r + 2), y1 + uy * (r + 2), x2 - ux * (r + 3), y2 - uy * (r + 3), PASS_COLOR, true, 2.5);
    } else {
      const r = len(BALL_R);
      drawArrow(x1 + ux * (r + 2), y1 + uy * (r + 2), x2, y2, SHOT_COLOR, false, 3.5);
    }
  }

  function drawSelection() {
    if (!selected) return;
    ctx.save();
    ctx.strokeStyle = '#ff7a1a';
    ctx.lineWidth = 3;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    const r = len(selected.kind === 'ball' ? BALL_R : PLAYER_R) + 5;
    ctx.arc(px(selected.x), py(selected.y), r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    if (selected.kind === 'ball') {
      ctx.save();
      ctx.strokeStyle = '#ff7a1a';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff7a1a';
      ctx.shadowBlur = 10;
      goals.forEach(g => {
        const x = g.side === 'L' ? -GOAL_DEPTH : FIELD_L;
        ctx.strokeRect(px(x) - 3, py(FIELD_W / 2 - GOAL_W / 2) - 3, len(GOAL_DEPTH) + 6, len(GOAL_W) + 6);
      });
      ctx.restore();
    }
  }

  // 动画期间，正在执行的对象带绿色脉冲光圈
  function drawActive() {
    if (!activeEnts.length) return;
    ctx.save();
    ctx.strokeStyle = ACTIVE_COLOR;
    ctx.lineWidth = 3;
    activeEnts.forEach(e => {
      ctx.beginPath();
      ctx.arc(px(e.x), py(e.y), len(e.kind === 'ball' ? BALL_R : PLAYER_R) + 4 + pulse.r * 3, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.restore();
  }

  // ===== 渲染（每帧最多一次）=====
  let rafPending = false;
  function requestRender() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; render(); });
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const m = oriMatrix();
    ctx.setTransform(dpr * m[0], dpr * m[1], dpr * m[2], dpr * m[3], dpr * m[4], dpr * m[5]);
    drawPool();
    drawMarkers();
    drawTrails();
    lines.forEach(drawLine);
    players.forEach(drawPlayer);
    drawBall();
    drawActive();
    drawSelection();
  }

  if (window.gsap) {
    gsap.to(pulse, { r: 1, duration: 0.5, yoyo: true, repeat: -1, ease: 'sine.inOut',
      onUpdate: () => { if (activeEnts.length) requestRender(); } });
  } else {
    pulse.r = 0.5;
  }

  // ===== 命中检测（像素 → 场地坐标，使用当前视角的反向映射）=====
  function eventToMeters(e) {
    const rect = canvas.getBoundingClientRect();
    const sw = isVertical() ? cssH : cssW, sh = isVertical() ? cssW : cssH;
    const { a: cx, b: cy } = screenToField((e.clientX - rect.left) * (sw / rect.width), (e.clientY - rect.top) * (sh / rect.height));
    return { x: cx / SCALE + view.x0, y: cy / SCALE - MARGIN, cx, cy };
  }

  function hitEntity(m) {
    const tol = COARSE.matches ? 0.65 : 0.2;     // 手指比鼠标粗：触屏时放宽命中范围
    if (!ball.hidden && Math.hypot(m.x - ball.x, m.y - ball.y) <= BALL_R + tol + 0.1) return ball;
    for (let i = players.length - 1; i >= 0; i--) {
      const p = players[i];
      if (Math.hypot(m.x - p.x, m.y - p.y) <= PLAYER_R + tol) return p;
    }
    return null;
  }

  function hitGoal(m) {
    const top = FIELD_W / 2 - GOAL_W / 2 - 0.4, bottom = FIELD_W / 2 + GOAL_W / 2 + 0.4;
    if (m.y < top || m.y > bottom) return null;
    if (m.x >= -1.0 && m.x <= 0.2) return goals[0];
    if (m.x >= FIELD_L - 0.2 && m.x <= FIELD_L + 1.0 && m.x <= view.x1) return goals[1];
    return null;
  }

  // ===== 画线模式逻辑 =====
  function describe(ent) {
    if (ent.kind === 'ball') return '水球';
    return nameOf(ent);
  }

  function updateHint() {
    const h = els.hint;
    h.classList.toggle('active', lineMode);
    if (!lineMode) { h.textContent = '拖动球员或水球可调整位置'; return; }
    if (!selected) h.textContent = '点击球员/水球作为起点（球员→球员：传球/跑位；水球→球门：射门）';
    else if (selected.kind === 'ball') h.textContent = '已选中水球，请点击一个球门完成射门线';
    else h.textContent = `已选中 ${describe(selected)}，请点击另一名球员（Esc 取消）`;
  }

  function setSelected(ent) {
    selected = ent;
    updateHint();
    requestRender();
  }

  function addLine(type, from, to) {
    const exists = lines.some(l => l.type === type && l.from === from && l.to === to);
    if (!exists) lines.push({ type, from, to });
  }

  function handleClick(ent, goal) {
    if (!lineMode) return;
    const target = ent || goal;
    if (!target) { setSelected(null); return; }
    if (!selected) {
      if (target.kind !== 'goal') setSelected(target);
      return;
    }
    if (target === selected) { setSelected(null); return; }
    if (selected.kind === 'ball' && target.kind === 'goal') {
      addLine('shot', ball, target);
      setSelected(null);
    } else if (selected.kind === 'player' && target.kind === 'player') {
      addLine('pass', selected, target);
      setSelected(null);
    } else if (target.kind !== 'goal') {
      setSelected(target);
    }
  }

  // ===== 指针交互：拖拽 + 点击 =====
  // 使用 Pointer Events：鼠标 / 触屏 / 手写笔共用同一套 pointerdown / pointermove / pointerup，
  // 等价于同时兼容 mousedown·mousemove·mouseup 与 touchstart·touchmove·touchend，且不会出现触屏后再触发一次鼠标事件的重复。
  // canvas 设置了 touch-action: none，手指按住球员拖动时页面不会滚动 / 缩放。
  let down = null;
  const COARSE = window.matchMedia('(pointer: coarse)');
  canvas.addEventListener('contextmenu', e => e.preventDefault());                // 禁止长按弹出菜单
  canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false }); // 兜底：旧版 iOS 不认 touch-action 时也不滚动
  canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

  canvas.addEventListener('pointerdown', e => {
    if (running) return;                       // 指令/战术动画播放期间锁定手动操作
    if (e.button !== undefined && e.button !== 0) return;
    if (e.isPrimary === false || down) return;   // 忽略多指中的第二根手指
    const m = eventToMeters(e);
    const ent = hitEntity(m);
    down = {
      pid: e.pointerId,
      thr: e.pointerType === 'touch' ? 10 : DRAG_THRESHOLD,                 // 触屏：移动超过 10px 才算拖动，轻点不会被当成拖拽
      noDrag: e.pointerType === 'touch' && lineMode,                         // 触屏画线模式：只“点选”，不拖拽，避免误触移位

      ent,
      goal: ent ? null : hitGoal(m),
      startCX: m.cx, startCY: m.cy,
      offX: ent ? ent.x - m.x : 0,
      offY: ent ? ent.y - m.y : 0,
      moved: false,
    };
    canvas.setPointerCapture(e.pointerId);
    if (ent && ent.kind === 'player') {
      players.splice(players.indexOf(ent), 1);
      players.push(ent);
      requestRender();
    }
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', e => {
    const m = eventToMeters(e);
    if (down) {
      if (e.pointerId !== down.pid) return;
      if (!down.ent || down.noDrag) return;
      if (!down.moved && Math.hypot(m.cx - down.startCX, m.cy - down.startCY) < down.thr) return;
      down.moved = true;
      canvas.style.cursor = 'grabbing';
      const r = down.ent.kind === 'ball' ? BALL_R : PLAYER_R;
      // 拖拽只改变球员位置（限制在当前视角的画布范围内）；已画好的轨迹是坐标副本，会原样保留
      down.ent.x = clamp(m.x + down.offX, view.x0 + r, view.x1 - r);
      down.ent.y = clamp(m.y + down.offY, -MARGIN + r, FIELD_W + MARGIN - r);
      requestRender();
      return;
    }
    const ent = hitEntity(m);
    if (ent && !running) canvas.style.cursor = lineMode ? 'pointer' : 'grab';
    else if (lineMode && selected && selected.kind === 'ball' && hitGoal(m)) canvas.style.cursor = 'pointer';
    else canvas.style.cursor = 'default';
  });

  function endPointer(e) {
    if (!down || e.pointerId !== down.pid) return;
    const d = down;
    down = null;
    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    if (!d.moved && e.type !== 'pointercancel') handleClick(d.ent, d.goal);
    const m = eventToMeters(e);
    canvas.style.cursor = hitEntity(m) ? (lineMode ? 'pointer' : 'grab') : 'default';
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // =====================================================================
  //              路径引擎：Catmull-Rom 曲线 + GSAP 沿路径动画 + 轨迹记录
  // =====================================================================
  // 向心 Catmull-Rom 样条（alpha=0.5）：穿过所有路点，且不会出现自交/过冲的环
  function catmullRom(pts, perSeg = 28, alpha = 0.5) {
    const n = pts.length;
    const ext = [
      { x: 2 * pts[0].x - pts[1].x, y: 2 * pts[0].y - pts[1].y },
      ...pts,
      { x: 2 * pts[n - 1].x - pts[n - 2].x, y: 2 * pts[n - 1].y - pts[n - 2].y },
    ];
    const out = [{ x: pts[0].x, y: pts[0].y }];
    for (let i = 0; i < n - 1; i++) {
      const p0 = ext[i], p1 = ext[i + 1], p2 = ext[i + 2], p3 = ext[i + 3];
      const knot = (a, b) => Math.max(Math.pow(Math.hypot(b.x - a.x, b.y - a.y), alpha), 1e-4);
      const t0 = 0, t1 = t0 + knot(p0, p1), t2 = t1 + knot(p1, p2), t3 = t2 + knot(p2, p3);
      for (let s = 1; s <= perSeg; s++) {
        const t = t1 + (t2 - t1) * s / perSeg;
        const mix = (a, b, ta, tb) => ({
          x: (tb - t) / (tb - ta) * a.x + (t - ta) / (tb - ta) * b.x,
          y: (tb - t) / (tb - ta) * a.y + (t - ta) / (tb - ta) * b.y,
        });
        const A1 = mix(p0, p1, t0, t1), A2 = mix(p1, p2, t1, t2), A3 = mix(p2, p3, t2, t3);
        const B1 = mix(A1, A2, t0, t2), B2 = mix(A2, A3, t1, t3);
        out.push(mix(B1, B2, t1, t2));
      }
    }
    return out;
  }

  /**
   * 把路点列表变成可按弧长取点的路径。
   * wps   : [{x,y}, ...]，第一个是起点；只有两个点时是直线，三个及以上时是平滑曲线
   * avoid : [{x,y,r}, ...]，曲线上进入圆内的点会被推到圆外，保证“绕过”而不是“穿过”
   */
  function buildPath(wps, avoid = []) {
    const pts = [{ x: wps[0].x, y: wps[0].y }];
    for (let i = 1; i < wps.length; i++) {
      if (d2(wps[i], pts[pts.length - 1]) > 0.05) pts.push({ x: wps[i].x, y: wps[i].y });
    }
    if (pts.length < 2) pts.push({ x: pts[0].x + 0.001, y: pts[0].y });

    let samples = pts.length === 2 ? pts : catmullRom(pts);
    if (avoid.length && samples.length > 2) {
      samples = samples.map((p, i) => {
        if (i === 0 || i === samples.length - 1) return p;
        const q = { x: p.x, y: p.y };
        avoid.forEach(a => {
          const d = Math.hypot(q.x - a.x, q.y - a.y);
          if (d < a.r && d > 1e-6) { q.x = a.x + (q.x - a.x) / d * a.r; q.y = a.y + (q.y - a.y) / d * a.r; }
        });
        return q;
      });
    }
    let total = 0;
    const out = samples.map((p, i) => {
      if (i > 0) total += Math.hypot(p.x - samples[i - 1].x, p.y - samples[i - 1].y);
      return { x: p.x, y: p.y, d: total };
    });
    return { samples: out, total };
  }

  function pointOnPath(path, t) {
    const s = path.samples;
    if (path.total <= 0 || t <= 0) return s[0];
    if (t >= 1) return s[s.length - 1];
    const target = t * path.total;
    let lo = 0, hi = s.length - 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (s[mid].d < target) lo = mid; else hi = mid;
    }
    const seg = s[hi].d - s[lo].d || 1;
    const k = (target - s[lo].d) / seg;
    return { x: s[lo].x + (s[hi].x - s[lo].x) * k, y: s[lo].y + (s[hi].y - s[lo].y) * k };
  }

  /**
   * 让 obj 沿路点路径平滑运动（GSAP 驱动一个 0→1 的进度，再按弧长取点，速度均匀、转弯平滑）。
   * 球员移动时同步记录轨迹（坐标副本），移动结束后轨迹保留；opts.noTrail 可关闭记录（如视角切换时的重新站位）。
   */
  function animatePath(obj, wps, dur, ease = 'power1.inOut', opts = {}) {
    const path = buildPath(wps, opts.avoid || []);
    let trail = null;
    if (obj.kind === 'player' && !opts.noTrail) {
      trail = { team: obj.team, pts: [{ x: path.samples[0].x, y: path.samples[0].y }] };
      trails.push(trail);
    }
    const proxy = { t: 0 };
    const apply = () => {
      const p = pointOnPath(path, proxy.t);
      obj.x = p.x; obj.y = p.y;
      if (trail) {
        const last = trail.pts[trail.pts.length - 1];
        if (Math.hypot(p.x - last.x, p.y - last.y) >= 0.12) trail.pts.push({ x: p.x, y: p.y });
      }
      requestRender();
    };
    return new Promise(resolve => {
      const finish = () => {
        proxy.t = 1; apply();
        if (trail) {                              // 保证轨迹终点与球员最终位置一致
          const e = path.samples[path.samples.length - 1], last = trail.pts[trail.pts.length - 1];
          if (Math.hypot(e.x - last.x, e.y - last.y) > 1e-6) trail.pts.push({ x: e.x, y: e.y });
        }
        resolve();
      };
      if (window.gsap) {
        const tw = gsap.to(proxy, { t: 1, duration: dur, ease, onUpdate: apply, onComplete: finish });
        activeTweens.push(tw);
      } else {
        // 没有加载到 GSAP（例如离线）时的简易缓动兜底
        const t0 = performance.now(), token = runToken;
        const step = now => {
          if (token !== runToken) return;
          const k = Math.min(1, (now - t0) / (dur * 1000));
          proxy.t = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          apply();
          if (k < 1) requestAnimationFrame(step); else finish();
        };
        requestAnimationFrame(step);
      }
    });
  }

  // 直线移动（经典战术脚本使用）：同样会留下轨迹
  const tweenTo = (obj, x, y, dur, ease) => animatePath(obj, [{ x: obj.x, y: obj.y }, { x, y }], dur, ease);

  // =====================================================================
  //                       指令解析器（正则）
  // =====================================================================
  const CN_NUM = { 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8 };
  const toNum = s => (/^\d+$/.test(s) ? parseInt(s, 10) : CN_NUM[s]);
  const teamOf = s => (/^[白aA]/.test(s) ? 'A' : 'B');

  const TEAM_RE = '白队|白帽|白|蓝队|蓝帽|蓝|[aAbB]队';
  const NUM_RE = '\\d{1,2}|[一二两三四五六七八]';
  const TEAM = `(?<team>${TEAM_RE})`;
  // 号码或守门员，p 为命名分组前缀
  const nn = p => `(?:(?<${p}num>${NUM_RE})号?|(?<${p}gk>守门员|门将|红帽))`;

  // 射门：蓝队射门 / 蓝队5号射门
  const RE_SHOT = new RegExp(`^(?:${TEAM})?(?:${nn('s')})?(?:射门|攻门|远射|起射|打门|射)$`);
  // 传球：白队水球传给4号 / 白队3号传给4号 / 水球传给蓝队4号
  const RE_PASS = new RegExp(
    `^(?:${TEAM})?(?:${nn('p')}|把?水球|把?球)?(?:把球)?` +
    `(?:传球给|传球到|传球向|传给|传向|传到|传)(?:(?<rt>${TEAM_RE}))?${nn('r')}$`);
  // 跑位：队伍 + 号码 + 一串路径片段（可含“从…”、多个路点、“绕过…”、“交叉补位”）
  const RE_CLAUSE = new RegExp(`^${TEAM}${nn('a')}(?<rest>.+)$`);
  // 单个路径片段：[从X] 游向/移动到 Y [绕过Z] [交叉补位]
  const SEG_RE = new RegExp(
    '^(?:从(?<from>.+?))?' +
    '(?:游向|游到|游至|游往|移动到|移动至|移动向|移到|移至|跑到|跑向|前往|前插到|插到|切入|穿插到|冲向|走向|回到|回防到|补位到|站到|向|到|至)' +
    '(?<to>.+?)' +
    '(?:并?(?:绕过|绕开|绕行|避开)(?<by>.+?))?' +
    '(?<cross>交叉补位|交叉换位|补位|换位)?$');
  // 位置描述里的“某号球员的位置”“蓝队中锋”
  const RE_PREF = new RegExp(`^(?:(${TEAM_RE}))?(?:(${NUM_RE})号|(守门员|门将))(初始)?(?:的位置|位置|处|附近|身边)?$`);
  const RE_CF = new RegExp(`^(?:(${TEAM_RE}))?(?:的)?中锋(?:位置|处|附近)?$`);

  const SEQ_SPLIT = /(?:然后|接着|随后)(?=(?:白队|蓝队|白|蓝|[aAbB]队))/g;
  const PAR_MARK = /[，]?(?:与此同时|同一时间|同时)(?=(?:白队|蓝队|白|蓝|[aAbB]队))/g;

  // 把整段输入拆成“指令组”：组与组按顺序执行，组内的指令（以“同时”连接）并行执行
  function parseInput(raw) {
    let s = raw
      .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/\s+/g, '')
      .replace(/,/g, '，')
      .replace(PAR_MARK, '；@P@')
      .replace(SEQ_SPLIT, '；');
    const groups = [];
    s.split(/[；;。\n]+/).filter(Boolean).forEach(part => {
      if (part.startsWith('@P@')) {
        const c = part.slice(3);
        if (!c) return;
        if (groups.length) groups[groups.length - 1].push(c); else groups.push([c]);
      } else {
        groups.push([part]);
      }
    });
    return groups;
  }

  function parseTarget(s) {
    const t = { end: null, lat: null, vert: null, kind: null };
    if (/己方|本方|我方|自己|防守|后场/.test(s)) t.end = 'own';
    else if (/对方|对手|对面|敌方|进攻|前场/.test(s)) t.end = 'opp';

    let m;
    if ((m = /(左|右)(?:侧|边|方|面)?/.exec(s))) t.lat = m[1] === '左' ? 'left' : 'right';
    if ((m = /(上|下)(?:侧|边|方|面)/.exec(s))) t.vert = m[1] === '上' ? 'up' : 'down';

    if ((m = /(\d{1,2}|[二五六])(?:米线|米|m)/i.exec(s)) && toNum(m[1]) >= 1 && toNum(m[1]) <= 12) {
      t.kind = 'line'; t.d = toNum(m[1]);
    } else if (/禁区|球门区/.test(s)) t.kind = 'area';
    else if (/中线|中场/.test(s)) t.kind = 'mid';
    else if (/场地中心|中心|中央/.test(s)) t.kind = 'center';
    else if (/球门/.test(s)) t.kind = 'goal';
    else if (/水球|球/.test(s)) t.kind = 'ball';
    else return null;
    return t;
  }

  // ===== 工具函数 =====
  const GA_TOP = (FIELD_W - GOAL_AREA_W) / 2, GA_BOTTOM = GA_TOP + GOAL_AREA_W;
  const nameOf = p => `${TEAMS[p.team].name}${p.isGK ? '守门员' : p.num + '号'}`;
  // “6打5”按场上球员人数计算（不含门将）
  const countOf = team => players.filter(p => p.team === team && !p.isGK).length;

  // 场上球员按号码（从 1 号起）匹配；门将没有号码，只能写“守门员/门将”
  function findPlayer(team, numStr, gk) {
    const list = players.filter(p => p.team === team);
    if (gk) {
      const g = list.find(p => p.isGK);
      return g ? { p: g } : { error: `${TEAMS[team].name}当前没有守门员。` };
    }
    const n = toNum(numStr);
    const p = list.find(q => !q.isGK && q.num === n);
    if (p) return { p };
    const nums = list.filter(q => !q.isGK).map(q => q.num).sort((a, b) => a - b).join('、');
    return { error: `${TEAMS[team].name}场上没有 ${n} 号球员（当前号码：${nums}${list.some(q => q.isGK) ? '；门将请写“守门员”' : ''}）。` };
  }

  function nearestOf(team, maxD) {
    let best = null, bd = Infinity;
    players.forEach(p => {
      if (team && p.team !== team) return;
      const d = Math.hypot(p.x - ball.x, p.y - ball.y);
      if (d < bd) { bd = d; best = p; }
    });
    return best && bd <= maxD ? best : null;
  }

  // “中锋”：该队场上球员里最贴近场地中轴线（y=10）的一名，并列时取离移动者最近的
  function centerForward(team, near) {
    const list = players.filter(p => p.team === team && !p.isGK);
    if (!list.length) return null;
    return list.slice().sort((a, b) =>
      (Math.abs(a.y - FIELD_W / 2) - Math.abs(b.y - FIELD_W / 2)) || (d2(a, near) - d2(b, near)))[0];
  }

  // 避让：目标点附近有人时，沿 y 方向找最近的空位
  function findFreeSpot(x, y, mover) {
    const ok = (cx, cy) => players.every(p => p === mover || Math.hypot(p.x - cx, p.y - cy) >= 1.05);
    if (ok(x, y)) return { x, y };
    for (let i = 1; i <= 10; i++) {
      for (const sgn of [1, -1]) {
        const cy = y + sgn * i * 0.9;
        if (cy < 0.5 || cy > FIELD_W - 0.5) continue;
        if (ok(x, cy)) return { x, y: cy };
      }
    }
    return { x, y };
  }

  // base：该移动片段的出发点（多路点时是上一个路点）
  function resolveTarget(t, mover, base) {
    const aSide = attackSide(mover.team);
    const ownSide = aSide === 'R' ? 'L' : 'R';
    let side;
    if (t.end) side = t.end === 'own' ? ownSide : aSide;
    else if (view.mode === 'half') side = 'L';              // 半场视角：没写“己方/对方”时，默认指画面里的左侧端
    else side = mover.isGK ? ownSide : aSide;               // 全场：门将默认指己方端，其余默认指对方端
    const end = side === aSide ? 'opp' : 'own';
    const gx = goalXOf(side), dir = side === 'L' ? 1 : -1;
    const endName = end === 'own' ? '己方' : '对方';
    const latText = t.lat === 'left' ? '左侧' : t.lat === 'right' ? '右侧' : '';
    const vertText = t.vert === 'up' ? '上方' : t.vert === 'down' ? '下方' : '';
    const mod = latText + vertText;

    let x = base.x, y = base.y, text = '';
    switch (t.kind) {
      case 'line':
        x = gx + dir * t.d; text = `${endName}${t.d}米线${mod}`; break;
      case 'area':
        x = gx + dir * (mover.isGK ? 0.7 : 1.0);
        y = clamp(y, GA_TOP + 0.8, GA_BOTTOM - 0.8);
        text = `${endName}球门区`; break;
      case 'mid':
        x = FIELD_L / 2; text = `中线${mod}`; break;
      case 'center':
        x = FIELD_L / 2; y = FIELD_W / 2; text = `场地中心${mod}`; break;
      case 'goal':
        x = gx + dir * (mover.isGK ? 0.7 : 1.6); y = FIELD_W / 2; text = `${endName}球门前`; break;
      case 'ball':
        x = ball.x - attackDir(mover.team) * 0.9; y = ball.y; text = '水球附近'; break;
    }
    if (t.kind === 'line' || t.kind === 'mid' || t.kind === 'center') {
      if (t.lat) x += t.lat === 'left' ? -1 : 1;
      if (t.vert) y = t.vert === 'up' ? 3.5 : 16.5;
    }
    const out = x > view.x1 - 0.3;                           // 落在当前视角之外（如半场模式下的右半场）
    x = clamp(x, 0.5, Math.min(FIELD_L - 0.5, view.x1 - 0.5));
    y = clamp(y, 0.5, FIELD_W - 0.5);
    const free = findFreeSpot(x, y, mover);
    return { x: free.x, y: free.y, text, kind: t.kind, end, d: t.d, lat: t.lat, vert: t.vert, out };
  }

  // ----- 位置描述 → 坐标（路点解析的核心）-----
  // 支持：某号球员的位置 / 初始位置 / 附近、蓝队中锋、侧翼(左翼/右翼)、中间/中路，以及 2/5/6米线、禁区、中线、球门前、场地中心、水球 等
  function resolveSpot(spec, mover, base) {
    let m;
    if ((m = RE_CF.exec(spec))) {
      const team = m[1] ? teamOf(m[1]) : (mover.team === 'A' ? 'B' : 'A');
      const p = centerForward(team, mover);
      if (!p) return { error: `${TEAMS[team].name}场上没有可作为中锋的球员。` };
      return { x: p.x, y: p.y, label: `${nameOf(p)}（中锋）的位置`, ref: p };
    }
    if ((m = RE_PREF.exec(spec))) {
      const team = m[1] ? teamOf(m[1]) : mover.team;
      const r = findPlayer(team, m[2], !!m[3]);
      if (r.error) return { error: r.error };
      const p = r.p;
      let x = p.x, y = p.y;
      if (/附近|身边/.test(spec)) {                      // “附近”：停在对方朝向自己一侧 1.3 米处
        const d = d2(p, base) || 1;
        x = p.x + (base.x - p.x) / d * 1.3; y = p.y + (base.y - p.y) / d * 1.3;
      }
      return { x, y, label: `${nameOf(p)}${m[4] ? '的初始位置' : '的位置'}`, ref: p };
    }
    if (/左翼|右翼|侧翼|边路|边线|边上/.test(spec)) {
      // 左/右以各队进攻方向为准：面朝右侧球门时左翼在屏幕上侧，面朝左侧球门时左翼在屏幕下侧
      const leftIsTop = attackSide(mover.team) === 'R';
      let top;
      if (/左翼/.test(spec)) top = leftIsTop;
      else if (/右翼/.test(spec)) top = !leftIsTop;
      else top = base.y < FIELD_W / 2;
      return { x: base.x, y: top ? 2.5 : FIELD_W - 2.5, label: /左翼|右翼/.test(spec) ? (/左翼/.test(spec) ? '左翼' : '右翼') : (top ? '上侧边路' : '下侧边路') };
    }
    if (/^(中间|中路|中央)$/.test(spec)) return { x: base.x, y: FIELD_W / 2, label: '中路', isMiddle: true };

    const t = parseTarget(spec);
    if (!t) return { error: `无法识别位置“${spec}”。可用：某号球员的位置/初始位置、蓝队中锋、侧翼、中间、2/5/6米线、禁区、中线、球门前、场地中心、水球。` };
    const res = resolveTarget(t, mover, base);
    if (res.out) return { error: `“${spec}”在当前半场视角之外（右半场）。请切换到全场视角，或改写成指向左侧的位置。` };
    return { x: res.x, y: res.y, label: res.text, res };
  }

  // 要“绕过”的对象：中心点、中锋、某号球员
  function resolveObstacle(spec, mover) {
    if (/^(场地)?(中心点?|中点|中央)$/.test(spec)) return { x: FIELD_L / 2, y: FIELD_W / 2, r: 2.6, label: '场地中心点' };
    const s = resolveSpot(spec, mover, { x: mover.x, y: mover.y });
    if (s.error) return s;
    if (!s.ref) return { error: `“${spec}”不是可以绕过的对象，请写“蓝队中锋”“蓝队3号”或“中心点”。` };
    return { x: s.ref.x, y: s.ref.y, r: 1.7, label: s.label.replace(/的(初始)?位置$/, '') };
  }

  // 绕过障碍物时的侧面路点：取 S→Y→E 总路程更短的一侧（并列时走离起点所在边线更近的一侧）
  function flankPoint(S, E, Y) {
    const L = d2(S, Y) || 1;
    const ux = (Y.x - S.x) / L, uy = (Y.y - S.y) / L;
    const nx = -uy, ny = ux;
    const P1 = { x: Y.x + nx * Y.r, y: Y.y + ny * Y.r };
    const P2 = { x: Y.x - nx * Y.r, y: Y.y - ny * Y.r };
    const c1 = d2(S, P1) + d2(P1, E), c2 = d2(S, P2) + d2(P2, E);
    if (Math.abs(c1 - c2) < 0.05) return Math.abs(P1.y - S.y) <= Math.abs(P2.y - S.y) ? P1 : P2;
    return c1 < c2 ? P1 : P2;
  }

  // “交叉补位”的弧度：把 S→E 的中点向一侧鼓出（两人对向交叉时，鼓出方向正好相反，不会撞到一起）
  function bulgePoint(S, E) {
    const dx = E.x - S.x, dy = E.y - S.y, L = Math.hypot(dx, dy) || 1;
    const k = Math.max(1.2, 0.18 * L);
    return { x: (S.x + E.x) / 2 - dy / L * k, y: (S.y + E.y) / 2 + dx / L * k };
  }

  // ===== 讲解文案生成 =====
  function condPhrase(team) {
    const a = countOf(team), b = countOf(team === 'A' ? 'B' : 'A');
    if (a > b) return `利用${a}打${b}的人数优势`;
    if (a === b) return `在${a}打${b}的均势下`;
    return `在${a}打${b}的人数劣势下`;
  }

  function movePurpose(r, mover) {
    const own = r.end === 'own';
    const lat = r.lat === 'left' ? '左' : r.lat === 'right' ? '右' : '';
    const spread = lat
      ? (own ? `，并向${lat}侧补位，封堵传球线路` : `，并向${lat}侧拉开，扩大进攻宽度、牵制防守`)
      : '';
    switch (r.kind) {
      case 'line':
        if (own) return `回收到己方${r.d}米线，收缩防线、保护球门前沿${spread}`;
        if (r.d === 2) return `贴近球门前沿，伺机接球转身或抢点，制造近距离威胁${spread}`;
        if (r.d === 5) return `到达5米线附近，可兼顾中距离射门和战术配合${spread}`;
        if (r.d === 6) return `寻找空位，接应外围传球并随时形成射门威胁${spread}`;
        return `调整站位、保持场上间距${spread}`;
      case 'area':
        if (mover.isGK) return '回到球门区内，重新封堵门前角度';
        return own ? '回收到己方球门区，贴近球门协助防守' : '压入对方球门区附近，争取近距离接球和二次进攻机会';
      case 'mid':
        return `回到中线附近，参与攻防转换、保持场上纵深${spread}`;
      case 'goal':
        if (mover.isGK) return '守在门前，缩小射门角度';
        return own ? '回到己方门前，协防封堵射门路线' : '压到对方球门前，抢占点位准备补射或抢点';
      case 'center':
        return '回到场地中心，重新组织站位';
      case 'ball':
        return '靠近水球，准备接应、争抢球权或对持球人施压';
    }
    return '调整站位';
  }

  // ===== 计划构建：把一条指令变成“要播放的动画轨道 + 要显示的讲解” =====
  // plan = { explain, lines, actives, tracks:[{ obj, wps, dur, ease, avoid }] }
  // ===== 快捷指令：全员压上 / 拿球 =====
  const RE_ALLIN = new RegExp(`^${TEAM}(?:全员|全体|所有人|全部)(?:球员)?(?:一起)?(?:压上|前压|压前|强攻|进攻)$`);
  const RE_TAKE = new RegExp(`^${TEAM}${nn('a')}(?:去)?(?:拿球|持球|抢球|拿到球|接球)$`);

  // 全员压上：本方所有场上球员（不含门将）沿宽度方向展开，推进到对方 6–8 米线一带
  function planAllIn(g) {
    const team = teamOf(g.team);
    const side = attackSide(team), gx = goalXOf(side), dir = attackDir(team);
    if (gx > view.x1 - 0.2) return { error: `${TEAMS[team].name}进攻的球门在当前半场视角之外，请先切换到全场视角。` };
    const movers = players.filter(p => p.team === team && !p.isGK).sort((a, b) => a.y - b.y);
    if (!movers.length) return { error: `${TEAMS[team].name}场上没有可移动的球员。` };
    const n = movers.length;
    const tracks = movers.map((p, i) => {
      const y = n === 1 ? FIELD_W / 2 : 2.8 + (FIELD_W - 5.6) * i / (n - 1);          // 按当前 y 顺序分配，避免互相穿插
      const edge = Math.abs(y - FIELD_W / 2) / (FIELD_W / 2);                           // 边路稍靠后，中路更靠前，形成弧形
      const dist = 6.6 + 2.2 * edge + (i % 2 ? 0.5 : 0);
      const tx = clamp(gx - dir * dist, 0.8, FIELD_L - 0.8);
      return { obj: p, wps: [{ x: p.x, y: p.y }, { x: tx, y }], dur: 1.9, ease: 'power2.inOut' };
    });
    const ownGK = players.some(p => p.team === team && p.isGK);
    const explain = `【解析】${TEAMS[team].name}${n}名场上球员全线压上，在对方6米线外沿弧形展开，` +
      `${ownGK ? '门将留守后场，' : '无门将，全员投入进攻，'}用人数和宽度逼迫对方收缩防守，随时准备传导或起射。`;
    return { explain, lines: [], actives: movers.slice(), tracks };
  }

  // 拿球：指定球员游向水球，停在球的后侧（持球）
  function planTake(g) {
    const team = teamOf(g.team);
    const r = findPlayer(team, g.anum, g.agk);
    if (r.error) return { error: r.error };
    const p = r.p, dir = attackDir(team);
    const tx = clamp(ball.x - dir * 0.85, view.x0 + 0.6, Math.min(FIELD_L - 0.6, view.x1 - 0.6));
    const ty = clamp(ball.y, 0.6, FIELD_W - 0.6);
    const d = Math.hypot(tx - p.x, ty - p.y);
    return {
      explain: `【解析】${nameOf(p)}游向水球（约${d.toFixed(1)}米）并控制住球，取得球权，准备发起下一次进攻。`,
      lines: [],
      actives: [p, ball],
      tracks: [{ obj: p, wps: [{ x: p.x, y: p.y }, { x: tx, y: ty }], dur: clamp(d / SWIM_SPEED, 0.6, 2.4), ease: 'power2.inOut' }],
    };
  }

  function buildPlan(clause) {
    const plain = clause.replace(/[，。.!！?？、]/g, '');
    let m;
    if ((m = RE_ALLIN.exec(plain))) return planAllIn(m.groups);
    if ((m = RE_TAKE.exec(plain))) return planTake(m.groups);
    if ((m = RE_SHOT.exec(plain))) return planShot(m.groups);
    if ((m = RE_PASS.exec(plain))) return planPass(m.groups);
    if ((m = RE_CLAUSE.exec(clause.replace(/[。.!！?？]+$/, '')))) return planMovePath(m.groups);
    return { error: '无法识别该指令。支持的格式示例：\n· 白队3号移动到6米线左侧\n· 白队2号从侧翼游向中间绕过蓝队中锋，然后游向1号位置；同时白队1号向2号初始位置交叉补位\n· 白队水球传给4号\n· 蓝队射门' };
  }

  function planMovePath(g) {
    const team = teamOf(g.team);
    const r = findPlayer(team, g.anum, g.agk);
    if (r.error) return { error: r.error };
    const mover = r.p;

    const segs = g.rest.split(/，|然后|接着|随后|之后/)
      .map(x => x.replace(/^(并且|并|就|再)/, '')).filter(Boolean);
    if (!segs.length) return { error: '没有读到要去的位置。示例：白队3号移动到6米线左侧。' };

    let base = { x: mover.x, y: mover.y };
    const wps = [{ x: base.x, y: base.y }];
    const avoid = [], texts = [];
    let anyBy = false, anyCross = false, simple = null;

    for (let i = 0; i < segs.length; i++) {
      const m = SEG_RE.exec(segs[i]);
      if (!m) return { error: `无法理解路径片段“${segs[i]}”。示例：从侧翼游向中间绕过蓝队中锋 / 游向1号位置 / 移动到6米线左侧。` };
      const { from, to, by, cross } = m.groups;

      // “从X”：只有当 X 离当前位置较远时，才先游到 X；否则当作起点说明
      let fromText = '';
      if (from && i === 0) {
        const fs = resolveSpot(from, mover, base);
        if (fs.error) return { error: fs.error };
        fromText = `从${fs.label}出发，`;
        if (d2(base, fs) > 2.5) { wps.push({ x: fs.x, y: fs.y }); base = { x: fs.x, y: fs.y }; }
      }

      const target = resolveSpot(to, mover, base);
      if (target.error) return { error: target.error };
      let obstacle = null;
      if (by) {
        obstacle = resolveObstacle(by, mover);
        if (obstacle.error) return { error: obstacle.error };
      }

      let end = { x: target.x, y: target.y };
      // “游向中间绕过X”：绕到 X 的另一侧再停下，终点落在 X 身后
      if (obstacle && target.isMiddle) {
        const dx = obstacle.x - base.x, dy = obstacle.y - base.y, L = Math.hypot(dx, dy) || 1;
        end = {
          x: clamp(obstacle.x + dx / L * (obstacle.r + 1.0), 0.5, Math.min(FIELD_L - 0.5, view.x1 - 0.5)),
          y: clamp(obstacle.y + dy / L * (obstacle.r + 1.0), 0.5, FIELD_W - 0.5),
        };
      }

      if (obstacle) {
        wps.push(flankPoint(base, end, obstacle));
        avoid.push({ x: obstacle.x, y: obstacle.y, r: obstacle.r * 0.75 });
        anyBy = true;
      } else if (cross && d2(base, end) > 3) {
        wps.push(bulgePoint(base, end));
      }
      if (cross) anyCross = true;
      wps.push(end);
      base = end;

      texts.push(`${fromText}游向${target.label}` +
        (obstacle ? `，沿弧线绕过${obstacle.label}` : '') +
        (cross ? '，与队友交叉换位' : ''));
      if (segs.length === 1 && !by && !cross && target.res && !from) simple = target.res;
    }

    const cond = condPhrase(team);
    let explain;
    if (simple) {
      explain = `【解析】${nameOf(mover)}${cond}，移动至${simple.text}，${movePurpose(simple, mover)}。`;
    } else {
      let tail = '用弧线跑位拉扯对方防线';
      if (anyBy && anyCross) tail = '用弧线绕开对手并与队友交叉换位，拉扯防线的同时保持阵型紧凑';
      else if (anyBy) tail = '用弧线绕开对手，避免直线穿插被封堵，同时拉扯对方防线';
      else if (anyCross) tail = '与队友交叉换位，保持阵型紧凑';
      explain = `【解析】${nameOf(mover)}${cond}，${texts.join('，随后')}，${tail}。`;
    }

    const total = buildPath(wps, avoid).total;
    return {
      explain, lines: [], actives: [mover],
      tracks: [{ obj: mover, wps, avoid, dur: clamp(total / SWIM_SPEED, 0.8, 7), ease: wps.length > 2 ? 'power1.inOut' : 'power2.inOut' }],
    };
  }

  function planPass(g) {
    let team = g.team ? teamOf(g.team) : null;
    if (!team && (g.pnum || g.pgk)) return { error: '请指明传球一方的队伍，例如“白队3号传给4号”。' };
    if (!team) {
      const holder = nearestOf(null, 1.5);
      if (!holder) return { error: '无法判断由哪一队传球，请写明队伍，例如“白队水球传给4号”。' };
      team = holder.team;
    }
    let passer = null;
    if (g.pnum || g.pgk) {
      const pr = findPlayer(team, g.pnum, g.pgk);
      if (pr.error) return { error: pr.error };
      passer = pr.p;
    } else {
      passer = nearestOf(team, 1.5);
    }

    const rteam = g.rt ? teamOf(g.rt) : team;
    const rr = findPlayer(rteam, g.rnum, g.rgk);
    if (rr.error) return { error: rr.error };
    const receiver = rr.p;
    if (receiver === passer) return { error: '不能把球传给自己。' };

    const from = passer || { kind: 'anchor', x: ball.x, y: ball.y };
    const d = Math.hypot(receiver.x - ball.x, receiver.y - ball.y);
    const bx = clamp(receiver.x + attackDir(rteam) * 0.8, view.x0 + 0.3, Math.min(FIELD_L - 0.3, view.x1 - 0.3));
    const by = clamp(receiver.y, 0.3, FIELD_W - 0.3);

    let style;
    if (d < 4) style = '短距离快速出球，压缩对方的反应时间';
    else if (d < 9) style = '中距离传导，转移球的落点并寻找防守空档';
    else style = '长传转移，横向调动对方防线并制造宽度';
    let extra = '';
    if (rteam !== team) extra = '（注意：传向对方球员，等同于传球失误）';
    else if (receiver.isGK) extra = '（回传守门员，重新组织进攻）';

    const who = passer ? nameOf(passer) : TEAMS[team].name;
    const explain = `【解析】${who}${condPhrase(team)}，将球传给${nameOf(receiver)}，传球距离约${d.toFixed(1)}米，${style}${extra}。`;
    return {
      explain,
      lines: [['pass', from, receiver]],
      actives: [ball, receiver],
      tracks: [{ obj: ball, wps: [{ x: ball.x, y: ball.y }, { x: bx, y: by }], dur: clamp(d / 11, 0.5, 1.4), ease: 'power1.inOut' }],
    };
  }

  function planShot(g) {
    let team = g.team ? teamOf(g.team) : null;
    if (!team && (g.snum || g.sgk)) return { error: '请指明射门一方的队伍，例如“蓝队5号射门”。' };
    if (!team) {
      const holder = nearestOf(null, 1.5);
      if (!holder) return { error: '无法判断由哪一队射门，请写明队伍，例如“蓝队射门”。' };
      team = holder.team;
    }
    let shooter = null;
    if (g.snum || g.sgk) {
      const sr = findPlayer(team, g.snum, g.sgk);
      if (sr.error) return { error: sr.error };
      shooter = sr.p;
    } else {
      shooter = nearestOf(team, 2.0);
    }

    const side = attackSide(team);                         // 攻向对方球门
    const gx = goalXOf(side);
    if (gx > view.x1 - 0.2) return { error: `${TEAMS[team].name}进攻的球门在当前半场视角之外，请先切换到全场视角。` };
    const ty = ball.y < FIELD_W / 2 ? FIELD_W / 2 + 0.9 : FIELD_W / 2 - 0.9;   // 打向远角
    const endX = gx + (side === 'R' ? 0.2 : -0.2);
    const d = Math.abs(gx - ball.x);
    const inside = d < 6;
    const who = shooter ? nameOf(shooter) : TEAMS[team].name;
    const explain = `【解析】${who}${condPhrase(team)}，在距对方球门线约${d.toFixed(1)}米处起射（${inside ? '6米线内，可直接出手' : '6米线外，出手距离较远'}），瞄准球门远角，考验守门员的横向移动。`;
    const startPt = { kind: 'anchor', x: ball.x, y: ball.y };
    const endPt = { kind: 'anchor', x: gx, y: ty };
    const dd = Math.hypot(endX - ball.x, ty - ball.y);
    return {
      explain,
      lines: [['shot', startPt, endPt]],
      actives: shooter ? [ball, shooter] : [ball],
      tracks: [{ obj: ball, wps: [{ x: ball.x, y: ball.y }, { x: endX, y: ty }], dur: clamp(dd / 20, 0.4, 1.2), ease: 'power2.in' }],
    };
  }

  // =====================================================================
  //                         讲解面板 + 指令执行
  // =====================================================================
  function addEntry(cmdText, text, kind) {
    const box = document.createElement('div');
    box.className = 'entry' + (kind ? ' ' + kind : '');
    const cmd = document.createElement('div');
    cmd.className = 'cmd';
    cmd.textContent = '▶ ' + cmdText;
    const body = document.createElement('div');
    body.className = 'text';
    body.style.whiteSpace = 'pre-line';
    box.append(cmd, body);
    els.log.appendChild(box);
    els.log.scrollTop = els.log.scrollHeight;

    if (window.gsap) {
      gsap.from(box, { opacity: 0, y: 10, duration: 0.3 });
      // 打字机效果：讲解文字随动画同步逐字出现
      const proxy = { n: 0 };
      gsap.to(proxy, {
        n: text.length, ease: 'none',
        duration: clamp(text.length * 0.035, 0.6, 3.2),
        onUpdate: () => {
          body.textContent = text.slice(0, Math.round(proxy.n));
          els.log.scrollTop = els.log.scrollHeight;
        },
      });
    } else {
      body.textContent = text;
    }
  }

  // 执行一个指令组：组内所有指令同时开始（“同时”），全部结束后才进入下一组
  async function executeGroup(clauses, token) {
    const plans = [];
    for (const c of clauses) {
      const plan = buildPlan(c);
      if (plan.error) { addEntry(c, plan.error, 'err'); return; }
      plans.push(plan);
    }
    plans.forEach(pl => pl.lines.forEach(([type, a, b]) => addLine(type, a, b)));
    activeEnts = plans.flatMap(p => p.actives);
    addEntry(clauses.join('；'), plans.map(p => p.explain).join('\n'));
    requestRender();
    await Promise.all(plans.flatMap(p => p.tracks.map(t => animatePath(t.obj, t.wps, t.dur, t.ease, { avoid: t.avoid }))));
    if (token !== runToken) return;
    activeEnts = [];
    requestRender();
  }

  async function processQueue() {
    if (running) return;
    running = true;
    const token = runToken;
    while (queue.length) {
      const group = queue.shift();
      await executeGroup(group, token);
      if (token !== runToken) return;           // 中途被重置：旧循环直接退出
    }
    running = false;
    activeEnts = [];
    requestRender();
  }

  function submitCommand() {
    const raw = els.cmdInput.value.trim();
    if (!raw) return;
    const groups = parseInput(raw);
    if (!groups.length) return;
    setSelected(null);
    queue.push(...groups);
    els.cmdInput.value = '';
    processQueue();
  }

  // =====================================================================
  //                         经典战术脚本（全场视角）
  // =====================================================================
  // 坐标均为米，以白队(A)向右进攻为基准：A 攻右侧球门(x=25)，屏幕上侧为白队左翼，下侧为右翼。
  // 战术按钮会先自动切换到全场视角再播放。
  // 球员键：'A3' = 白队3号场上球员（号码从 1 起），'AG' / 'BG' = 白队 / 蓝队守门员（无号码）。
  // setup 中 nA/nB 为“场上球员人数（不含门将）”，gkA/gkB 为是否有门将。
  // step 字段：
  //   moves : { 键: [x, y, 可选时长] }          直线并行移动
  //   paths : { 键: { pts:[[x,y],...], dur } }   多路点曲线移动（从当前位置出发，依次穿过 pts）
  //   ball  : '球员键' (球停在该球员身旁) 或 [x, y]
  //   lines : [['pass'|'shot', 起点, 终点]]  起点/终点可为球员键、[x,y] 或 'ball'
  //   say   : 讲解文字（可为函数，运行时才取当时的人数）
  //   dur / ballDur / ballEase / pause
  const SCENARIOS = {
    // 预设：A 队 6 名场上球员 + 有门将；B 队 5 名场上球员 + 有门将
    perimeter: {
      title: '6打5 外围远射',
      setup: { nA: 6, gkA: true, nB: 5, gkB: true },
      setupText: '已设置：白队6名场上球员+门将，对蓝队5名场上球员+门将。白队多一人，目标是用外围传导拉开防守，再从6米线外起射。',
      steps: [
        {
          moves: {
            A1: [17.5, 4.5], A2: [16, 10], A3: [17.5, 15.5], A4: [13, 3.5], A5: [21.5, 10], A6: [13.5, 16.5],
            B1: [19.8, 4.5], B2: [19.8, 10], B3: [19.8, 15.5], B4: [22, 7.2], B5: [22, 12.8],

  const delay = ms => new Promise(r => setTimeout(r, ms));
  // 球员键：'A3' = 白队 3 号场上球员；'AG' / 'BG' = 白队 / 蓝队守门员
  const playerByKey = k => {
    const s = k.slice(1);
    return players.find(p => p.team === k[0] && (s === 'G' ? p.isGK : (!p.isGK && p.num === parseInt(s, 10))));
  };

  async function runStep(sc, step, idx, token) {
    const t0 = performance.now();
    const base = step.dur ?? 1.2;
    const dest = {};
    Object.entries(step.moves || {}).forEach(([k, v]) => { dest[k] = { x: v[0], y: v[1], dur: v[2] }; });

    // 连线：球员键用实体引用（会跟随移动），坐标/ball 用固定锚点
    const spec = s => Array.isArray(s) ? { kind: 'anchor', x: s[0], y: s[1] }
      : s === 'ball' ? { kind: 'anchor', x: ball.x, y: ball.y }
      : playerByKey(s);
    (step.lines || []).forEach(([type, a, b]) => {
      const A = spec(a), B = spec(b);
      if (A && B) addLine(type, A, B);
    });

    const tweens = [], actives = [];
    Object.entries(dest).forEach(([k, d]) => {
      const p = playerByKey(k);
      if (!p) return;
      actives.push(p);
      tweens.push(tweenTo(p, d.x, d.y, d.dur ?? base, 'power2.inOut'));
    });
    Object.entries(step.paths || {}).forEach(([k, v]) => {
      const p = playerByKey(k);
      if (!p) return;
      actives.push(p);
      const wps = [{ x: p.x, y: p.y }, ...v.pts.map(([x, y]) => ({ x, y }))];
      tweens.push(animatePath(p, wps, v.dur ?? base, 'power1.inOut'));
    });

    if (step.ball) {
      let bx, by;
      if (Array.isArray(step.ball)) {
        [bx, by] = step.ball;
      } else {
        const p = playerByKey(step.ball);
        const d = dest[step.ball] || p;
        bx = clamp(d.x + attackDir(p.team) * 0.8, 0.3, FIELD_L - 0.3);
        by = clamp(d.y, 0.3, FIELD_W - 0.3);
      }
      actives.push(ball);
      tweens.push(tweenTo(ball, bx, by, step.ballDur ?? base, step.ballEase || 'power2.inOut'));
    }

    activeEnts = actives;
    const text = typeof step.say === 'function' ? step.say() : step.say;
    if (text) addEntry(`${sc.title} · ${idx + 1}/${sc.steps.length}`, text);
    requestRender();

    await Promise.all(tweens);
    if (token !== runToken) return;
    // 至少等到讲解文字打完，再进入下一步
    const minMs = text ? clamp(text.length * 0.035, 0.6, 3.2) * 1000 : 0;
    await delay(Math.max(0, minMs - (performance.now() - t0)) + (step.pause ?? 0.4) * 1000);
  }

  async function startScenario(key) {
    const sc = SCENARIOS[key];
    if (!sc) return;
    if (view.mode !== 'full') changeView('full', false);   // 战术脚本按全场坐标编写：先切回全场视角
    if (sc.scene) {
      sc.scene();                               // 自定义场景（如交叉换位：只生成两名白队球员）
    } else {
      // 自动设置双方场上球员人数与门将状态（同步更新控制面板），并重置站位
      els.countA.value = sc.setup.nA; els.gkA.value = sc.setup.gkA ? '1' : '0';
      els.countB.value = sc.setup.nB; els.gkB.value = sc.setup.gkB ? '1' : '0';
      rebuild();
    }

    running = true;
    const token = runToken;
    markScenario(key);
    addEntry(sc.title, sc.setupText, 'sys');
    await delay(500);
    if (token !== runToken) return;

    for (let i = 0; i < sc.steps.length; i++) {
      await runStep(sc, sc.steps[i], i, token);
      if (token !== runToken) return;
    }
    running = false;
    activeEnts = [];
    markScenario(null);
    requestRender();
    if (queue.length) processQueue();           // 播放期间提交的文字指令，战术结束后继续执行
  }

  // 默认：全场视角；双方各 6 名场上球员 + 1 名门将（红帽无数字）；场上号码 1–6；
  // “显示球员号码”“显示跑动轨迹”勾选。先把控件值写成默认值（防止浏览器刷新时恢复旧的表单状态），
  // 再由 rebuild() 从控件读取并渲染，因此控制面板的数值与 Canvas 上实际渲染的 6+1 人始终一致。

  const appEl = document.getElementById('app');
  const panelToggle = document.getElementById('panelToggle');
  function setPanel(open) {
    appEl.classList.toggle('panel-open', open);
    panelToggle.setAttribute('aria-expanded', String(open));

  window.addEventListener('keydown', e => {

  });
  let initialOpen = window.innerWidth > 768;      // 手机上默认收起，不遮挡场地
  try { const v = localStorage.getItem('wp-panel-open'); if (v !== null) initialOpen = v === '1'; } catch (e) {}
  setPanel(initialOpen);

  // ===== 手机端：底部抽屉的关闭按钮 / 遮罩 / 自动收起 / 键盘避让 / 快捷指令 / 横屏提示 =====
  const MOBILE_Q = window.matchMedia('(max-width: 768px), (max-height: 520px) and (pointer: coarse)');
  const closeIfMobile = () => { if (MOBILE_Q.matches) setPanel(false); };
  document.getElementById('sheetClose').addEventListener('click', () => setPanel(false));

  if (window.visualViewport) {
    const vv = window.visualViewport;
    const syncVV = () => {
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', kb + 'px');
      document.documentElement.style.setProperty('--vvh', vv.height + 'px');

  if (window.innerWidth <= 768) {
    document.querySelectorAll('details.sec').forEach((d, i) => { d.open = (i === 1); });
  }

  const tip = document.getElementById('rotateTip');

  const checkTip = () => {
    const portraitPhone = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;

  };

  window.addEventListener('resize', checkTip);

  let lastBox = '';
  const refit = () => {
    const b = canvas.parentElement;
    const key = b.clientWidth + 'x' + b.clientHeight;
