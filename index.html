<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>水球战术模拟器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root {
    --bg: #0d1620; --panel: rgba(18, 29, 42, .88); --panel-solid: #121d2a; --line: rgba(120, 160, 200, .22);
    --text: #e8eef4; --muted: #8fa6bb; --accent: #19c37d; --accent-2: #ff7a1a; --field: #0f1a26;
    --pw: 360px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; }

  /* ===== 全屏舞台：画布居中并撑满剩余空间 ===== */
  #app { position: fixed; inset: 0; display: flex; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #1b2d40 0%, #0d1620 70%); }
  #canvasBox { flex: 1 1 auto; min-width: 0; height: 100%; display: flex; align-items: center; justify-content: center;
    margin-right: 0; transition: margin-right .32s cubic-bezier(.4, 0, .2, 1); }
  #app.panel-open #canvasBox { margin-right: calc(var(--pw) + 24px); }
  canvas { display: block; box-shadow: 0 10px 40px rgba(0,0,0,.55); border-radius: 4px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

  /* ===== 左上角品牌条 / 底部提示条（悬浮在画布上方）===== */
  #brand { position: fixed; top: 14px; left: 16px; opacity: .92; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0,0,0,.35); pointer-events: none; }
  #brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .4px; }
  #brand .sub { font-size: 11px; color: var(--muted); }
  #viewTag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: rgba(25,195,125,.16); color: #5fe0aa; }
  #hint { position: fixed; left: 16px; bottom: 14px; z-index: 5; max-width: calc(100vw - 32px); padding: 7px 14px; border-radius: 18px;
    background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; color: #a9bccd;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: none; transition: left .32s; }
  #hint.active { color: #ffb36b; border-color: rgba(255,179,107,.45); }

  /* ===== 模式单选 + 方向任务栏 ===== */
  .ctl-label { font-size: 12px; color: var(--muted); letter-spacing: .3px; margin-bottom: 6px; }
  .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .radio { position: relative; display: block; cursor: pointer; }
  .radio input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .radio span { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #3d566f; background: var(--field); font-weight: 600; font-size: 13.5px; transition: background .15s, border-color .15s; }
  .radio span::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #6f8aa3; box-sizing: border-box; transition: all .15s; }
  .radio input:checked + span { background: rgba(25,195,125,.14); border-color: var(--accent); color: #7ff0bf; }
  .radio input:checked + span::before { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 40%, transparent 45%); }
  .radio input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabbar { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid #3d566f; background: var(--field); }
  .tabbar button { flex: 1 1 0; border: 0; border-radius: 0; background: transparent; padding: 10px 4px; font-size: 14px; font-weight: 600;
    min-height: 42px; white-space: nowrap; transition: background .15s, color .15s; }
  .tabbar button + button { border-left: 1px solid #2f465c; }
  .tabbar button:hover:not(:disabled) { background: #1a2b3c; }
  .tabbar button[aria-pressed="true"], .tabbar button[aria-pressed="true"]:hover:not(:disabled) { background: var(--accent); color: #06231a; }
  .tabbar button:disabled { color: #5d7186; background: rgba(255,255,255,.03); cursor: not-allowed; }
  .tabbar button:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }

  /* ===== 总开关 ===== */
  #panelToggle { position: fixed; top: 14px; right: 16px; z-index: 30; display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 10px; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0,0,0,.4);
    font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s; }
  #panelToggle:hover { background: rgba(32, 50, 70, .95); border-color: rgba(120,160,200,.5); }
  #panelToggle .ico { font-size: 16px; line-height: 1; }

  /* ===== 悬浮控制面板：滑入滑出 ===== */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--pw); max-width: 92vw; z-index: 20;
    display: flex; flex-direction: column; padding: 64px 12px 12px;
    transform: translateX(105%); transition: transform .32s cubic-bezier(.4, 0, .2, 1); pointer-events: none; }
  #app.panel-open #panel { transform: translateX(0); pointer-events: auto; }
  #panelScroll { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; overflow-x: hidden;
    padding: 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: -10px 0 40px rgba(0,0,0,.45); }
  #panelScroll::-webkit-scrollbar { width: 8px; }
  #panelScroll::-webkit-scrollbar-thumb { background: rgba(140,170,200,.3); border-radius: 4px; }

  /* 手风琴区块 */
  details.sec { flex: 0 0 auto; border-radius: 10px; background: rgba(255,255,255,.035); border: 1px solid var(--line); overflow: hidden; }
  details.sec > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 11px 14px; cursor: pointer;
    font-weight: 600; font-size: 13.5px; user-select: none; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary .ic { width: 22px; text-align: center; }
  details.sec > summary::after { content: "›"; margin-left: auto; font-size: 18px; color: var(--muted); transition: transform .2s; }
  details.sec[open] > summary::after { transform: rotate(90deg); }
  details.sec > summary:hover { background: rgba(255,255,255,.04); }
  details.sec > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sec-body { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  details.sec.grow { flex: 1 1 220px; display: flex; flex-direction: column; min-height: 120px; }
  details.sec.grow:not([open]) { flex: 0 0 auto; }
  details.sec.grow .sec-body { flex: 1 1 auto; min-height: 0; }

  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .team-card { padding: 10px 12px; border-radius: 8px; background: rgba(0,0,0,.22); border-left: 4px solid #fff; display: flex; flex-direction: column; gap: 8px; }
  .team-card.b { border-left-color: #2f6fe0; }
  .team-card .name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .badge { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-weight: 700; font-size: 12px; }
  .a .badge { background: #fff; color: #000; }
  .b .badge { background: #1e5bd6; color: #fff; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: #cfdbe7; }
  label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  input[type="number"], select { padding: 6px 8px; border-radius: 6px; border: 1px solid #3d566f; background: var(--field); color: #fff;
    font-size: 13px; font-family: inherit; }
  input[type="number"] { width: 70px; }
  select { cursor: pointer; min-width: 0; max-width: 100%; }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
  .switch { position: relative; display: inline-flex; align-items: center; gap: 8px; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { width: 40px; height: 22px; border-radius: 11px; background: #55697c; position: relative; transition: background .15s; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + .track { background: var(--accent-2); }
  .switch input:checked + .track::after { transform: translateX(18px); }
  .switch input:focus-visible + .track { outline: 2px solid #9cc9ff; outline-offset: 2px; }

  button { padding: 7px 12px; border-radius: 7px; border: 1px solid #3d566f; background: var(--field); color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; }
  button:hover { background: #1a2b3c; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: #1f8f5f; border-color: #28b47a; font-weight: 600; }
  button.primary:hover { background: #26a671; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button.scn { text-align: left; font-weight: 600; border-left-width: 4px; padding: 9px 12px; }
  button.scn[data-scn="perimeter"] { border-left-color: #f1c40f; }
  button.scn[data-scn="fastbreak"] { border-left-color: #2ecc71; }
  button.scn[data-scn="allout"]    { border-left-color: #e74c3c; }
  button.scn[data-scn="cross"]     { border-left-color: #b57bee; }
  button.scn.on { background: #1f8f5f; border-color: #28b47a; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.5; }

  #cmdInput { width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid #3d566f; background: var(--field); color: #fff;
    font-size: 13.5px; font-family: inherit; resize: none; }
  #cmdInput:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #chips > .chip { display: block; margin-top: 6px; width: 100%; }
  .chip { padding: 5px 10px; font-size: 12px; border-radius: 14px; background: #1b2a39; text-align: left; line-height: 1.4; }

  /* 战术讲解 */
  #log { flex: 1 1 auto; min-height: 80px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
  .entry { background: #1b2a39; border-left: 3px solid #28b47a; border-radius: 6px; padding: 8px 10px; }
  .entry.err { border-left-color: #e5534b; }
  .entry.sys { border-left-color: #5b738a; color: #a9bccd; }
  .entry .cmd { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; word-break: break-all; }
  .entry .text { font-size: 13px; line-height: 1.6; }
  .entry.err .text { color: #ffb4ae; }

  /* ===== 快捷指令按钮（所有设备可用，手机上尤其方便）===== */
  #quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #quick button { text-align: center; font-weight: 600; background: #17344a; border-color: #2c5b80; }
  #quick button:hover { background: #1d4260; }

  /* ===== 面板头部（仅手机底部抽屉显示）/ 遮罩 / 横屏提示 ===== */
  #sheetHead, #scrim { display: none; }
  #rotateTip { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 24px;
    background: rgba(6, 12, 20, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #rotateTip.show { display: flex; }
  #rotateTip .card { width: min(340px, 100%); padding: 26px 22px 20px; border-radius: 18px; text-align: center;
    background: var(--panel-solid); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #rotateTip .phone { width: 34px; height: 58px; margin: 0 auto 18px; border: 3px solid #9cc9ff; border-radius: 8px; position: relative;
    animation: tipSpin 2.4s ease-in-out infinite; }
  #rotateTip .phone::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 8px; height: 3px; margin-left: -4px; border-radius: 2px; background: #9cc9ff; }
  @keyframes tipSpin { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
  #rotateTip h2 { margin: 0 0 6px; font-size: 18px; }
  #rotateTip p { margin: 0 0 16px; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
  #rotateTip button { width: 100%; margin-top: 8px; min-height: 46px; }

  /* ===== 触屏：所有可点击控件至少 44px，输入框字号 ≥16px（避免 iOS 聚焦时自动缩放页面）===== */
  @media (pointer: coarse), (max-width: 768px) {
    button, select, input[type="number"], summary { min-height: 44px; }
    button { padding: 10px 14px; font-size: 14.5px; }
    input[type="number"], select { font-size: 16px; padding: 8px 10px; }
    input[type="number"] { width: 84px; }
    #cmdInput { font-size: 16px; padding: 11px 12px; }
    .field { min-height: 44px; }
    input[type="checkbox"] { width: 26px; height: 26px; }
    .switch { min-height: 44px; }
    .switch .track { width: 52px; height: 30px; border-radius: 15px; }
    .switch .track::after { top: 3px; left: 3px; width: 24px; height: 24px; }
    .switch input:checked + .track::after { transform: translateX(22px); }
    details.sec > summary { min-height: 48px; font-size: 15px; }
    .chip { min-height: 44px; font-size: 13.5px; border-radius: 12px; }
    #panelToggle { min-height: 44px; min-width: 44px; }
  }

  /* ===== 手机 / 小平板（≤768px）===== */
  @media (max-width: 768px) {
    #brand { top: calc(8px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); padding: 6px 10px; gap: 6px; }
    #brand h1, #brand .sub { display: none; }
    #viewTag { font-size: 12px; }
    #panelToggle { top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); padding: 8px 12px; }
    #hint { left: calc(8px + env(safe-area-inset-left)); bottom: calc(10px + env(safe-area-inset-bottom)); max-width: calc(100vw - 80px);
      font-size: 12px; padding: 6px 12px; border-radius: 14px; }
  }

  /* —— 竖屏手机：底部抽屉（Bottom Sheet）—— */
  @media (max-width: 768px) and (orientation: portrait) {
    #canvasBox { padding: 56px 0 64px; }
    #app.panel-open #canvasBox { margin-right: 0; }
    #panel { top: auto; left: 0; right: 0; bottom: var(--kb, 0px); width: 100%; max-width: 100%; padding: 0;
      max-height: calc(var(--vvh, 100dvh) * .72); transform: translateY(105%); }
    #app.panel-open #panel { transform: translateY(0); }
    #panelScroll { border-radius: 18px 18px 0 0; padding: 0 10px calc(14px + env(safe-area-inset-bottom)); gap: 8px;
      box-shadow: 0 -12px 40px rgba(0,0,0,.55); overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    #sheetHead { display: flex; position: sticky; top: 0; z-index: 2; align-items: center; justify-content: space-between; gap: 10px;
      margin: 0 -10px; padding: 14px 12px 8px; background: var(--panel-solid); border-radius: 18px 18px 0 0; }
    #sheetHead::before { content: ""; position: absolute; top: 6px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: rgba(160,190,220,.4); }
    #sheetHead b { font-size: 15px; }
    #sheetClose { min-width: 88px; font-weight: 700; background: #2a1f26; border-color: #8a4452; }
    #scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .3s; }
    #app.panel-open #scrim { opacity: 1; pointer-events: auto; }
    #panelToggle { z-index: 14; }
  }

  /* —— 横屏手机：矮屏，面板改为右侧抽屉，场地尽量占满 —— */
  @media (max-height: 520px) and (orientation: landscape) {
    :root { --pw: min(340px, 46vw); }
    #canvasBox { padding: 4px; }
    #panel { padding: 56px 8px 8px; }
    #brand { padding: 4px 8px; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- 全屏画布：尺寸由 JS 按可用空间自适应（1 米 = SCALE 像素，横纵同比，不变形） -->
  <main id="canvasBox"><canvas id="pool"></canvas></main>

  <div id="brand">
    <h1>🤽 水球战术模拟器</h1>
    <span id="viewTag">全场</span>
    <span class="sub">2D Tactics Board</span>
  </div>
  <div id="hint">拖动球员或水球可调整位置</div>

  <!-- 竖屏手机：横屏提示 -->
  <div id="rotateTip" role="dialog" aria-modal="true" aria-label="横屏提示">
    <div class="card">
      <div class="phone"></div>
      <h2>请横屏体验更佳</h2>
      <p>水球场地是横向长方形，横屏时可以看到更大的场地。也可以继续竖屏使用：切换为半场模式并让球门在上方。</p>
      <button type="button" id="tipVertical" class="primary">竖屏使用（半场 · 球门在上）</button>
      <button type="button" id="tipDismiss">我知道了</button>
    </div>
  </div>

  <!-- 总开关 -->
  <button id="panelToggle" type="button" aria-controls="panel" aria-expanded="true" title="展开/收起控制面板（快捷键 M）">
    <span class="ico">✕</span><span class="txt">收起</span>
  </button>

  <!-- 悬浮控制面板（手风琴） -->
  <div id="scrim"></div>
  <aside id="panel" aria-label="控制面板">
    <div id="panelScroll">
      <div id="sheetHead"><b>🎛️ 控制面板</b><button id="sheetClose" type="button" aria-label="关闭面板">✕ 关闭</button></div>

      <details class="sec" open>
        <summary><span class="ic">🎛️</span>视角与人数</summary>
        <div class="sec-body">
          <div>
            <div class="ctl-label">显示模式</div>
            <div class="radio-group" role="radiogroup" aria-label="显示模式">
              <label class="radio"><input type="radio" name="viewMode" value="full" checked autocomplete="off"><span>全景模式</span></label>
              <label class="radio"><input type="radio" name="viewMode" value="half" autocomplete="off"><span>半场模式</span></label>
            </div>
          </div>
          <div>
            <div class="ctl-label">方向选择（球门位置）</div>
            <div class="tabbar" id="oriBar" role="group" aria-label="方向选择">
              <button type="button" data-ori="left"   aria-pressed="true">← 左</button>
              <button type="button" data-ori="right"  aria-pressed="false">→ 右</button>
              <button type="button" data-ori="top"    aria-pressed="false">↑ 上</button>
              <button type="button" data-ori="bottom" aria-pressed="false">↓ 下</button>
            </div>
            <div class="note" id="oriNote" style="margin-top:6px"></div>
          </div>
          <div class="team-card a">
            <div class="name"><span class="badge">A</span>白队</div>
            <label class="field">场上球员（3–7）<input type="number" id="countA" min="3" max="7" value="6" autocomplete="off"></label>
            <label class="field">门将
              <select id="gkA" autocomplete="off">
                <option value="1" selected>有门将</option>
                <option value="0">无门将</option>
              </select>
            </label>
          </div>
          <div class="team-card b">
            <div class="name"><span class="badge">B</span>蓝队</div>
            <label class="field">场上球员（3–7）<input type="number" id="countB" min="3" max="7" value="6" autocomplete="off"></label>
            <label class="field">门将
              <select id="gkB" autocomplete="off">
                <option value="1" selected>有门将</option>
                <option value="0">无门将</option>
              </select>
            </label>
          </div>
          <label class="field"><span>显示球员号码</span><input type="checkbox" id="showNums" checked autocomplete="off"></label>
          <div class="btn-grid">
            <button id="resetBtn" type="button">重置站位</button>
            <button id="defaultsBtn" type="button">恢复默认 6+1</button>
          </div>
        </div>
      </details>

      <details class="sec" open>
        <summary><span class="ic">⌨️</span>文字战术指令</summary>
        <div class="sec-body">
          <div id="quick" aria-label="快捷指令">
            <button type="button" data-cmd="白队全员压上">白队全员压上</button>
            <button type="button" data-cmd="蓝队全员压上">蓝队全员压上</button>
            <button type="button" data-cmd="蓝队2号拿球">蓝队2号拿球</button>
            <button type="button" data-cmd="白队1号拿球">白队1号拿球</button>
            <button type="button" data-cmd="白队水球传给4号">白队水球传给4号</button>
            <button type="button" data-cmd="白队3号移动到6米线左侧">白队3号到6米线左侧</button>
            <button type="button" data-cmd="白队射门">白队射门</button>
            <button type="button" data-cmd="蓝队射门">蓝队射门</button>

          <textarea id="cmdInput" rows="3" autocomplete="off" placeholder="或手动输入，Enter 执行。例如：白队2号从侧翼游向中间绕过蓝队中锋，然后游向1号位置；同时白队1号向2号初始位置交叉补位"></textarea>
          <button id="runBtn" class="primary" type="button">执行</button>

      <details class="sec" open>
        <summary><span class="ic">⚡</span>一键战术</summary>
        <div class="sec-body">
          <div class="btn-grid">
            <button class="scn" type="button" data-scn="perimeter" title="白队6名场上球员+门将 vs 蓝队5名场上球员+门将">6打5 外围远射</button>
            <button class="scn" type="button" data-scn="fastbreak" title="白队4名场上球员+门将 vs 蓝队3名场上球员+门将">4打3 快速反击</button>
            <button class="scn" type="button" data-scn="allout"    title="白队7名场上球员无门将 vs 蓝队6名场上球员+门将">撤门将全线压上</button>
            <button class="scn" type="button" data-scn="cross"     title="自动生成两名白队球员，演示弧线绕行与交叉换位，并保留跑动轨迹">交叉换位</button>
          </div>
          <div class="note">点击后自动切换到全场视角、设置场景并播放，讲解同步显示在下方“战术讲解”。</div>

      </details>

      <details class="sec" open>
        <summary><span class="ic">🧭</span>轨迹控制</summary>
        <div class="sec-body">
          <label class="switch">
            <input type="checkbox" id="lineMode">
            <span class="track"></span>
            <span>画线模式</span>
          </label>
          <label class="field"><span>显示跑动轨迹</span><input type="checkbox" id="showTrails" checked autocomplete="off"></label>
          <div class="btn-grid">
            <button id="clearLines" type="button">清除所有连线</button>
            <button id="clearTrails" type="button">清除跑动轨迹</button>
          </div>
        </div>
